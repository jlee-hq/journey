<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private presentation</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f14;color:#e9ecf1;font:16px system-ui}main{width:min(360px,85vw)}h1{font-size:1.7rem}label{display:block;margin-bottom:8px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:4px}input{background:#121722;color:#fff;border:1px solid #596273}button{margin-top:12px;background:#ff4655;color:#fff;border:0;cursor:pointer}p{color:#aab2c0}#status{min-height:3em}</style></head>
<body><main><h1>Private presentation</h1><form id="unlock"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Unlock</button><p id="status" role="status" aria-live="polite"></p></form><noscript>JavaScript is required to decrypt this presentation.</noscript></main>
<script>
const form = document.getElementById('unlock');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  const status = document.getElementById('status');
  button.disabled = true;
  status.textContent = 'Unlocking and loading media…';
  let html;
  try {
    if (!crypto.subtle || !window.DecompressionStream) throw new Error('browser');
    const response = await fetch('site.enc', { cache: 'no-store' });
    if (!response.ok) throw new Error('download');
    const payload = new Uint8Array(await response.arrayBuffer());
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('password').value), 'PBKDF2', false, ['deriveKey']);
    document.getElementById('password').value = '';
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: payload.slice(0,16), iterations: 600000, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const compressed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: payload.slice(16,28) }, key, payload.slice(28));
    html = await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  } catch (error) {
    status.textContent = error.message === 'browser' ? 'Use a current browser over HTTPS or localhost.' : error.message === 'download' || error instanceof TypeError ? 'Could not load the encrypted presentation. Check your connection and try again.' : 'Incorrect password or damaged presentation. Try again.';
    button.disabled = false;
    return;
  }
  document.open();
  document.write(html);
  document.close();
});
</script></body></html>
